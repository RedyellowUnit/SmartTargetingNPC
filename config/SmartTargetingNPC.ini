[Hate]

; Base threat value assigned to the closest candidate to ensure they are not ignored.
fBaseThreat = 5.000000

; The percentage difference in hate required to switch targets (0.15 = 15%).
; Higher values make NPCs more stubborn about switching targets.
fSwitchThreshold = 0.150000

; The half-life of accumulated hate in seconds. Determines how fast threat decays over time.
fHateHalfLife = 30.000000

; Massive hate bonus for targets under the effect of Courage or Ally spells (Taunt mechanic).
fTauntBonus = 1000.000000

; Health percentage threshold to trigger the "Executioner" (Finish Off) bonus (0.3 = 30% HP).
fExecutionerThreshold = 0.300000

; Bonus hate added to the current target when their health falls below the threshold.
fExecutionerBonus = 500.000000

; Hate bonus added when an actor performs a Bash attack.
fBashHateBonus = 50.000000

; Hate bonus added to the summoner when a summoned creature enters combat.
fSummonHateBonus = 100.000000

; Hate bonus added to the killer when an ally is killed.
; Nearby allies within fMidRange will gain this much hate toward the killer.
fKillTransferBonus = 200.000000


[Range]

; Distance threshold for "Near" range. Hate weight is 1.0x within this range.
fNearRange = 800.000000

; Distance threshold for "Mid" range. Hate weight drops to 0.6x beyond this range.
fMidRange = 2000.000000

; Maximum distance for forced detection of the focused target.
; Within this range, the NPC will "see" their focus target even if they are trying to hide.
fForceDetectRange = 3000.000000
